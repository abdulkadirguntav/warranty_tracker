name: warranty_tracker
description: "Offline-first Warranty Tracker (Garanti Takip) mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Routing
  go_router: ^17.3.0

  # Local database (offline-first)
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # Notifications
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1

  # Utilities
  uuid: ^4.5.3
  intl: ^0.20.2
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  path: ^1.9.1
  share_plus: ^11.1.0
  file_picker: ^11.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

  # Code generation
  build_runner: ^2.4.14
  hive_ce_generator: ^1.8.2
  riverpod_generator: ^4.0.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_logo_launcher.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo_launcher.png"
  remove_alpha_ios: true
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
